name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: sh build-deb.sh "${GITHUB_REF_NAME#v}"

      - name: Create release and upload .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.deb --title "$GITHUB_REF_NAME" --generate-notes
